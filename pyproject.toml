[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hep-network-analysis"
version = "0.1.0"
description = "CLI tool for analyzing HEP-Th citation and co-authorship networks."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "hep-network-analysis contributors" }
]
dependencies = [
  "numpy>=1.20.0",
  "scipy>=1.7.0",
  "networkx>=3.0",
  "matplotlib>=3.5.0",
  "scikit-learn>=1.0.0",
  "pandas>=1.4.0",
  "numba>=0.56.0",
  "joblib>=1.2.0",
  "powerlaw>=1.5.0",
  "python-louvain>=0.16",
  "pyvis>=0.3.0",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "snakemake>=7.0.0",
  "pulp<2.8",
]

[project.scripts]
hep-network-analysis = "main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

